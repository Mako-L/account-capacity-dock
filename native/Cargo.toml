[package]
name = "mako-capacity"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
strip = true
