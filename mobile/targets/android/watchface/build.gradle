apply plugin: "com.android.application"

// Resource-only Watch Face Format package; installs next to the Wear app and reads its complications.
android {
    namespace "dev.mako.capacity.watchface"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "dev.mako.capacity.watchface"
        minSdkVersion 34
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file("../app/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        // R8 strips the generated R classes, so the APK ships without a dex as hasCode=false requires.
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled true
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
        }
    }
}
