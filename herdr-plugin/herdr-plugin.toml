id = "mako-capacity"
name = "Mako Capacity"
version = "1.0.0"
min_herdr_version = "0.8.0"
description = "Percent used for every Claude, Codex and Cursor account, and your live agents with their steps, docked beside your panes."
platforms = ["macos", "linux"]

[[panes]]
id = "capacity"
title = "Capacity"
placement = "split"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/capacity.py\""]

[[panes]]
id = "app"
title = "Capacity"
placement = "split"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/../scripts/capacity.py\" ui dock --terminal"]

[[panes]]
id = "agents"
title = "Agents"
placement = "split"
command = ["sh", "-c", "MAKO_WIDGET=agents exec python3 \"$HERDR_PLUGIN_ROOT/../scripts/capacity.py\" ui agents --terminal"]

[[actions]]
id = "open-right"
title = "Mako Capacity: dock on the right"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/open.py\" right"]

[[actions]]
id = "open-left"
title = "Mako Capacity: dock on the left"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/open.py\" left"]

[[actions]]
id = "pin-right"
title = "Mako Capacity: pin on the right in every tab"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/open.py\" pin right"]

[[actions]]
id = "pin-left"
title = "Mako Capacity: pin on the left in every tab"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/open.py\" pin left"]

[[actions]]
id = "pin-app-right"
title = "Mako Capacity: pin the app on the right in every tab"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/open.py\" pin right app"]

[[actions]]
id = "pin-app-left"
title = "Mako Capacity: pin the app on the left in every tab"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/open.py\" pin left app"]

[[actions]]
id = "open-agents-right"
title = "Mako Capacity: agents on the right"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/open.py\" right agents"]

[[actions]]
id = "pin-agents-right"
title = "Mako Capacity: pin agents on the right in every tab"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/open.py\" pin right agents"]

[[actions]]
id = "pin-agents-left"
title = "Mako Capacity: pin agents on the left in every tab"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/open.py\" pin left agents"]

[[actions]]
id = "unpin-agents"
title = "Mako Capacity: unpin agents"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/open.py\" unpin agents"]

[[actions]]
id = "toggle-pin"
title = "Mako Capacity: pin or unpin"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/open.py\" toggle"]

[[actions]]
id = "unpin"
title = "Mako Capacity: unpin"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/open.py\" unpin"]

[[events]]
on = "tab.focused"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/open.py\" ensure"]

[[events]]
on = "workspace.focused"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/open.py\" ensure"]
